name: Python Multi-Job Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build step
        run: echo "Building the application"

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Test step
        run: python app.py
  deploy:
    needs: test
#    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deploy step
        run: echo "Deploying application"
