name: Python Multi-Job Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build step
        run: echo "Building the application"

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Test step
        run: python app.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy step
        run: echo "Deploying application"
